<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuoArena // Reaction Duel</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

    <a href="index.html" class="nav-back">← BACK TO HUB</a>

    <div class="container duel-container">
        
        <!-- Табло счета -->
        <div class="scoreboard">
            <div class="player-score left">
                <div class="player-name">NIKITA</div>
                <div class="score-number">0</div>
            </div>
            <div class="score-divider">:</div>
            <div class="player-score right">
                <div class="player-name">GLEB</div>
                <div class="score-number">0</div>
            </div>
        </div>

        <!-- Игровая интерактивная зона -->
        <div class="reaction-zone waiting">
            <div class="zone-status">WAITING...</div>
            <button class="btn-ready">Ready</button>
        </div>

        <!-- Рекорды -->
        <div class="records-box">
            <div class="records-title">// Best reaction</div>
            <div class="record-line">
                <span>Nikita:</span>
                <span>173 ms</span>
            </div>
            <div class="record-line">
                <span>Gleb:</span>
                <span>168 ms</span>
            </div>
        </div>

    </div>

</body>
</html>
