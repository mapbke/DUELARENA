<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuoArena // Blind Timing</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

    <a href="index.html" class="nav-back">← BACK TO HUB</a>

    <div class="container duel-container">
        
        <div class="header" style="margin-bottom: 1rem;">
            <h1 style="font-size: 2rem;">Blind Timing</h1>
        </div>

        <div class="typing-box" style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3rem; padding: 4rem 2rem;">
            
            <!-- Цель раунда -->
            <div style="font-family: var(--font-mono); font-size: 1.1rem; color: var(--text-muted); letter-spacing: 1px;">
                TARGET: <span style="color: var(--accent-bright); font-weight: 700;">5.000s</span>
            </div>

            <!-- Большое табло времени (после старта через секунду тут будет написано [ BLIND MODE ]) -->
            <div style="font-family: var(--font-mono); font-size: 3.5rem; font-weight: 700; color: #fff;">
                1.104s
            </div>

            <!-- Кнопка остановки времени, используем класс кликера для крутого отклика -->
            <button class="btn-clicker" style="max-width: 280px; height: 100px; font-size: 1.4rem;">
                STOP
            </button>
            
            <div class="typing-stats-live" style="justify-content: center; gap: 4rem; margin: 0;">
                <div class="stat-live-item">
                    <span>Your Result:</span>
                    <span>0.000s</span>
                </div>
                <div class="stat-live-item">
                    <span>Difference:</span>
                    <span>0.000s</span>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
