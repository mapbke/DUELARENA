<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuoArena // Reaction Duel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/integration.css') }}">
</head>
<body>
    <a href="{{ url_for('index') }}" class="nav-back">← BACK TO HUB</a>

    <div class="user-status-bar">
        <div class="user-chip">
            <img src="{{ user.avatar_url }}" alt="">
            <div class="user-chip-meta">
                <strong>{{ user.login }}</strong>
                <small>GITHUB CONNECTED</small>
            </div>
        </div>
        <a class="auth-link" href="{{ url_for('logout') }}">LOGOUT</a>
    </div>

    <div class="container duel-container">
        <div class="header" style="margin-bottom:0;">
            <h1 style="font-size:2rem;">REACTION DUEL</h1>
            <p>// SERVER SIGNAL / LOWEST MS WINS</p>
        </div>

        {% set game_name = 'reaction' %}
        {% include '_room_lobby.html' %}

        <div class="scoreboard">
            <div class="player-score left">
                <div class="player-name" id="reaction-name-left">PLAYER 1</div>
                <div class="score-number" id="reaction-score-left">—</div>
            </div>
            <div class="score-divider">:</div>
            <div class="player-score right">
                <div class="player-name" id="reaction-name-right">PLAYER 2</div>
                <div class="score-number" id="reaction-score-right">—</div>
            </div>
        </div>

        <div class="reaction-zone waiting" id="reaction-area">
            <div class="zone-status" id="reaction-status">JOIN ROOM & READY UP</div>
        </div>

        <div class="game-message" id="game-message"></div>
    </div>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/socket.js') }}"></script>
    <script src="{{ url_for('static', filename='js/room.js') }}"></script>
    <script src="{{ url_for('static', filename='js/reaction.js') }}"></script>
</body>
</html>
