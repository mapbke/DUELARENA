<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuoArena // CPS Battle</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

    <a href="index.html" class="nav-back">← BACK TO HUB</a>

    <div class="container duel-container">
        
        <div class="header" style="margin-bottom: 1rem;">
            <h1 style="font-size: 2rem;">CPS Click Battle</h1>
        </div>

        <div class="typing-box" style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2.5rem; padding: 4rem 2rem;">
            
            <div style="font-family: var(--font-mono); font-size: 1.2rem; color: var(--text-muted); letter-spacing: 1px;">
                TIME LEFT: <span style="color: var(--error); font-weight: 700;">10.0s</span>
            </div>

            <!-- Интерактивная кнопка для кликов -->
            <button class="btn-clicker">
                CLICK TO START
            </button>
            
            <div class="typing-stats-live" style="justify-content: center; gap: 4rem; margin: 0;">
                <div class="stat-live-item">
                    <span>Total Clicks:</span>
                    <span>0</span>
                </div>
                <div class="stat-live-item">
                    <span>Clicks/Sec:</span>
                    <span>0.0</span>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
