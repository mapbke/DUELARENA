<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuoArena // CPS Battle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/integration.css') }}">
</head>
<body>
    <a href="{{ url_for('index') }}" class="nav-back">← BACK TO HUB</a>

    <div class="user-status-bar">
        <div class="user-chip">
            <img src="{{ user.avatar_url }}" alt="">
            <div class="user-chip-meta">
                <strong>{{ user.login }}</strong>
                <small>GITHUB CONNECTED</small>
            </div>
        </div>
        <a class="auth-link" href="{{ url_for('logout') }}">LOGOUT</a>
    </div>

    <div class="container duel-container">
        <div class="header" style="margin-bottom:0;">
            <h1 style="font-size:2rem;">CPS BATTLE</h1>
            <p>// 10 SECOND CLICK WAR</p>
        </div>

        {% set game_name = 'cps' %}
        {% include '_room_lobby.html' %}

        <div class="typing-box" style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:2rem;">
            <div style="font-family:var(--font-mono); color:var(--text-muted);">
                TIME LEFT: <span id="cps-time" style="color:var(--error); font-weight:700;">10.0s</span>
            </div>

            <button class="btn-clicker" id="cps-button" disabled>READY UP</button>

            <div class="typing-stats-live" style="justify-content:center; margin:0;">
                <div class="stat-live-item"><span>Total Clicks:</span> <span id="cps-clicks">0</span></div>
                <div class="stat-live-item"><span>Clicks/Sec:</span> <span id="cps-rate">0.0</span></div>
            </div>
        </div>
        <div class="game-message" id="game-message"></div>
    </div>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/socket.js') }}"></script>
    <script src="{{ url_for('static', filename='js/room.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cps.js') }}"></script>
</body>
</html>
